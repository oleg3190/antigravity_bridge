name: Standalone Docker Image

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile.standalone"
      - ".dockerignore"
      - "bridge/**"
      - "scripts/**"
      - "pyproject.toml"
      - "setup.py"
      - ".github/workflows/standalone-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/oleg3190/antigravity_bridge

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/oleg3190/antigravity_bridge \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --tag "${IMAGE}:3.2.9" \
            --tag "${IMAGE}:latest" \
            -f Dockerfile.standalone .

      - name: Smoke test
        run: |
          docker run -d --rm --name antigravity-bridge-smoke -p 18090:8090 "${IMAGE}:${GITHUB_SHA}"
          cleanup() { docker stop antigravity-bridge-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18090/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done

          docker logs antigravity-bridge-smoke
          exit 1

      - name: Push
        run: |
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:3.2.9"
          docker push "${IMAGE}:latest"
